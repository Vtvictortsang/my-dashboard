<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化佈局介面 - Google 登入版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. 插入 Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .content-area { height: calc(100vh - 64px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button id="menu-toggle" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
            <h1 class="text-xl font-bold tracking-tight">系統管理控制台</h1>
        </div>
        
        <!-- 右側狀態區：放置 Google 登入按鈕 -->
        <div class="flex items-center">
            <!-- 2. Google 登入按鈕容器 -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com" 
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="medium"
                 data-logo_alignment="left">
            </div>
        </div>
    </header>

    <div class="flex content-area">
        <!-- 側邊欄 -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 lg:flex w-64 flex-col bg-white border-r border-gray-200 transition-transform duration-300 ease-in-out z-40">
            <div class="p-6 flex-1">
                <nav class="space-y-1">
                    <a href="#" class="flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                        儀表板總覽
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        用戶管理
                    </a>
                </nav>
            </div>
            
            <!-- 側邊欄底部：顯示登入後的使用者資訊 -->
            <div id="user-info" class="p-4 border-t border-gray-100 hidden">
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl">
                    <img id="user-img" src="" alt="User" class="w-10 h-10 rounded-full border border-gray-200">
                    <div class="overflow-hidden">
                        <p id="user-name" class="text-sm font-bold text-gray-900 truncate"></p>
                        <p class="text-xs text-gray-500">已登入</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主要內容區 -->
        <main class="flex-1 overflow-y-auto p-8">
            <div id="welcome-message" class="bg-blue-50 border border-blue-100 p-6 rounded-2xl mb-8">
                <h3 class="text-xl font-bold text-blue-900 mb-2">歡迎使用系統</h3>
                <p class="text-blue-700">請先透過右上方 Google 按鈕登入以啟用完整功能。</p>
            </div>

            <!-- 數據卡片區域 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                    <p class="text-sm text-gray-500 font-medium">總訪問量</p>
                    <h4 class="text-3xl font-bold mt-2">24,512</h4>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                    <p class="text-sm text-gray-500 font-medium">活躍用戶</p>
                    <h4 class="text-3xl font-bold mt-2">1,205</h4>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
                    <p class="text-sm text-gray-500 font-medium">系統負荷</p>
                    <h4 class="text-3xl font-bold mt-2">24%</h4>
                </div>
            </div>
        </main>
    </div>

    <!-- 手機版側邊欄遮罩 -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden"></div>

    <script>
        // 3. 處理 Google 登入回傳
        function handleCredentialResponse(response) {
            // 解碼 JWT token (使用自定義函數)
            const data = parseJwt(response.credential);
            console.log("登入成功:", data);

            // 更新介面歡迎詞
            document.getElementById('welcome-message').innerHTML = `
                <h3 class="text-xl font-bold text-blue-900 mb-2">歡迎回來，${data.name}！</h3>
                <p class="text-blue-700">您已成功透過 ${data.email} 登入系統。</p>
            `;
            
            // 顯示側邊欄使用者資訊
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-img').src = data.picture;
            document.getElementById('user-name').innerText = data.name;
        }

        // 解析 JWT 的輔助函數
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 側邊欄控制邏輯
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
