<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化佈局介面 - Google 登入版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        
        .content-area {
            height: calc(100vh - 64px);
        }

        /* 模擬 Google 登入按鈕樣式 */
        .google-btn {
            transition: background-color .3s, box-shadow .3s;
            padding: 8px 16px;
            border: 1px solid #dadce0;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            border-radius: 4px;
            background-color: #fff;
            color: #3c4043;
            font-size: 14px;
            font-family: 'Google Sans', arial, sans-serif;
            font-weight: 500;
        }
        .google-btn:hover {
            background-color: #f8f9fa;
            border-color: #d2e3fc;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <!-- #置頂: 導覽列 (Navbar) -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <!-- 左側 Logo -->
        <div class="flex items-center gap-4">
            <!-- 行動版選單按鈕 (保留以便窄螢幕操控側邊欄) -->
            <button id="menu-toggle" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">L</div>
                <h1 class="text-xl font-bold tracking-tight text-gray-900">控制台系統</h1>
            </div>
        </div>
        
        <!-- 右側 Google 登入入口 -->
        <div class="flex items-center">
            <button class="google-btn shadow-sm">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>使用 Google 帳戶登入</span>
            </button>
        </div>
    </header>

    <div class="flex content-area">
        <!-- #左欄: 側邊導覽 (Sidebar) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 lg:flex w-64 flex-col bg-white border-r border-gray-200 transition-transform duration-300 ease-in-out z-40">
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="space-y-1">
                    <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">主選單</p>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        總覽
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                        數據分析
                    </a>
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50">
                <p class="text-xs text-center text-gray-400">請先登入以解鎖更多功能</p>
            </div>
        </aside>

        <!-- #右欄: 主要內容區 (Main Content) -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
            <!-- 麵包屑/頂部資訊 -->
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">歡迎使用系統</h2>
                    <p class="text-gray-500">請登入帳戶開始管理您的工作內容。</p>
                </div>
            </div>

            <!-- 數據卡片 (模擬內容) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm opacity-50">
                    <div class="h-4 w-1/2 bg-gray-200 rounded mb-4"></div>
                    <div class="h-8 w-3/4 bg-gray-100 rounded"></div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm opacity-50">
                    <div class="h-4 w-1/2 bg-gray-200 rounded mb-4"></div>
                    <div class="h-8 w-3/4 bg-gray-100 rounded"></div>
                </div>
                <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm opacity-50">
                    <div class="h-4 w-1/2 bg-gray-200 rounded mb-4"></div>
                    <div class="h-8 w-3/4 bg-gray-100 rounded"></div>
                </div>
            </div>

            <div class="bg-blue-50 border border-blue-100 p-8 rounded-2xl text-center">
                <h3 class="text-xl font-bold text-blue-900 mb-2">準備好開始了嗎？</h3>
                <p class="text-blue-700 mb-6">點擊上方按鈕，使用您的 Google 帳戶安全登入。</p>
                <div class="inline-block p-4 bg-white rounded-full shadow-lg">
                    <svg class="w-12 h-12" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </div>
            </div>
        </main>
    </div>

    <!-- 遮罩 (手機版側邊欄開啟時顯示) -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden"></div>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                overlay.classList.add('hidden');
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        });
    </script>
</body>
</html>
