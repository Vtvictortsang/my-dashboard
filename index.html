<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台系統 - Google 登入版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 插入 Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .content-area { height: calc(100vh - 64px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <!-- 頂部置頂導覽列 -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button id="menu-toggle" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
            
            <!-- 標識區：僅保留系統標題，移除公司資訊 -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">L</div>
                <h1 class="text-lg font-bold tracking-tight text-gray-800">控制台管理系統</h1>
            </div>
        </div>
        
        <!-- 右側狀態區：Google 登入按鈕 -->
        <div class="flex items-center gap-4">
            <!-- 登入前顯示 -->
            <div id="login-section">
                <div id="g_id_onload"
                     data-client_id="65363120-kv2pv822ma83d0hp43op7sj0go51juou.apps.googleusercontent.com" 
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-text="signin_with" data-size="medium" data-logo_alignment="left"></div>
            </div>

            <!-- 登入後顯示：使用者資訊與頭像 -->
            <div id="user-header-profile" class="hidden flex items-center gap-3 pl-4 border-l border-gray-200 animate-fade-in">
                <div class="text-right hidden sm:block">
                    <p id="header-user-name" class="text-sm font-bold text-gray-900 leading-none"></p>
                    <p id="header-user-email" class="text-[10px] text-gray-500 mt-1"></p>
                </div>
                <img id="header-user-img" src="" class="w-9 h-9 rounded-full border-2 border-white shadow-sm object-cover">
                <button onclick="location.reload()" class="p-1.5 hover:bg-red-50 text-red-400 rounded-lg transition-colors" title="登出系統">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="flex content-area">
        <!-- 側邊欄 -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 lg:flex w-64 flex-col bg-white border-r border-gray-200 transition-transform duration-300 ease-in-out z-40">
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="space-y-1">
                    <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">主選單</p>
                    <button onclick="showTab('overview')" class="w-full flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium nav-link" id="nav-overview">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        總覽
                    </button>
                    <button onclick="showTab('employer-detail')" class="w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg nav-link" id="nav-employer-detail">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        詳細規格
                    </button>
                </div>
            </div>
            
            <!-- 底部：快速狀態 -->
            <div class="p-4 border-t border-gray-100 bg-gray-50/50">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-xs font-medium text-gray-600">系統即時監控中</span>
                </div>
            </div>
        </aside>

        <!-- 主要內容 -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
            
            <!-- 頁面 1: 總覽 -->
            <div id="tab-overview" class="tab-content active">
                <div id="welcome-message" class="bg-white border border-gray-200 p-10 rounded-2xl text-center mb-8 shadow-sm transition-all">
                    <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">👋</div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">歡迎使用管理系統</h3>
                    <p class="text-gray-500">請透過右上角的 Google 按鈕登入以存取您的個人資料。</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <p class="text-sm text-gray-400 mb-1 font-medium">數據指標 A</p>
                        <h4 class="text-3xl font-bold text-gray-900">88%</h4>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <p class="text-sm text-gray-400 mb-1 font-medium">數據指標 B</p>
                        <h4 class="text-3xl font-bold text-gray-900">1,402</h4>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                        <p class="text-sm text-gray-400 mb-1 font-medium">數據指標 C</p>
                        <h4 class="text-3xl font-bold text-gray-900">Active</h4>
                    </div>
                </div>
            </div>

            <!-- 頁面 2: 詳細規格 (僱主資訊) -->
            <div id="tab-employer-detail" class="tab-content">
                <div class="max-w-4xl bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="bg-gray-900 p-8 text-white">
                        <h2 class="text-2xl font-bold mb-2">未來科技集團 - 僱主詳細規格</h2>
                        <p class="text-gray-400 text-sm font-light">最後更新日期：2024年4月27日</p>
                    </div>
                    <div class="p-8 space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 border-b border-gray-100 pb-8">
                            <div>
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">基本資料</h4>
                                <ul class="space-y-4">
                                    <li class="flex justify-between text-sm items-center"><span class="text-gray-500">公司名稱</span><span class="font-bold text-gray-800">未來科技集團</span></li>
                                    <li class="flex justify-between text-sm items-center"><span class="text-gray-500">產業類型</span><span class="font-medium">AI 軟體開發</span></li>
                                    <li class="flex justify-between text-sm items-center"><span class="text-gray-500">統一編號</span><span class="font-mono bg-gray-50 px-2 py-0.5 rounded">12345678</span></li>
                                </ul>
                            </div>
                            <div>
                                <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">合作狀態</h4>
                                <div class="bg-green-50 text-green-700 p-4 rounded-xl border border-green-100 flex items-center gap-3">
                                    <div class="w-3 h-3 bg-green-500 rounded-full shadow-[0_0_8px_rgba(34,197,94,0.5)]"></div>
                                    <span class="text-sm font-bold italic tracking-wide">白金級合作夥伴 (Active)</span>
                                </div>
                            </div>
                        </div>
                        <div class="pt-2">
                            <h4 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">備註事項</h4>
                            <p class="text-sm text-gray-600 leading-relaxed italic">
                                本頁面顯示之資訊由企業內部數據庫同步。如需修改基本資料，請連繫 HR 部門進行變更。
                            </p>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- 遮罩 -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden"></div>

    <script>
        // Tab 切換邏輯
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            const targetTab = document.getElementById('tab-' + tabName);
            if (targetTab) {
                targetTab.classList.add('active');
            }
            
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-blue-50', 'text-blue-700', 'font-medium');
                link.classList.add('text-gray-600');
            });
            const activeLink = document.getElementById('nav-' + tabName);
            if (activeLink) {
                activeLink.classList.add('bg-blue-50', 'text-blue-700', 'font-medium');
                activeLink.classList.remove('text-gray-600');
            }

            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }

        // 處理 Google 登入回傳
        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            console.log("登入成功:", data);
            
            // 1. 隱藏登入按鈕區，顯示使用者頭像區
            document.getElementById('login-section').classList.add('hidden');
            const profileArea = document.getElementById('user-header-profile');
            profileArea.classList.remove('hidden');
            
            document.getElementById('header-user-img').src = data.picture;
            document.getElementById('header-user-name').innerText = data.name;
            document.getElementById('header-user-email').innerText = data.email;

            // 2. 更新主畫面歡迎訊息
            const welcomeMsg = document.getElementById('welcome-message');
            welcomeMsg.innerHTML = `
                <div class="flex flex-col items-center animate-fade-in">
                    <div class="relative mb-6">
                        <img src="${data.picture}" class="w-24 h-24 rounded-full border-4 border-white shadow-xl">
                        <div class="absolute bottom-1 right-1 w-6 h-6 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-1">歡迎回來，${data.name}</h3>
                    <p class="text-blue-600 font-medium text-sm mb-4">${data.email}</p>
                    <div class="flex gap-2">
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full">系統管理員</span>
                        <span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">已驗證</span>
                    </div>
                </div>
            `;
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 側邊欄控制
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                overlay.classList.add('hidden');
                sidebar.classList.remove('-translate-x-full');
            } else {
                sidebar.classList.add('-translate-x-full');
            }
        });
    </script>
</body>
</html>
