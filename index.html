<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現代化佈局介面 - Google 登入版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1. 插入 Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .content-area { height: calc(100vh - 64px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button id="menu-toggle" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">L</div>
                <h1 class="text-xl font-bold tracking-tight text-gray-900">控制台系統</h1>
            </div>
        </div>
        
        <!-- 2. 更改: 這裡放置 Google 登入按鈕 -->
        <div class="flex items-center">
            <!-- Google 登入配置區 -->
            <div id="g_id_onload"
                 data-client_id="您的_CLIENT_ID_請貼在此處" 
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <!-- 官方按鈕組件 -->
            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>
        </div>
    </header>

    <div class="flex content-area">
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 lg:flex w-64 flex-col bg-white border-r border-gray-200 transition-transform duration-300 ease-in-out z-40">
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="space-y-1">
                    <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">主選單</p>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium">總覽</a>
                    <a href="#" class="flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg">數據分析</a>
                </div>
            </div>
            <!-- 登入後的使用者資訊 -->
            <div id="user-info" class="p-4 border-t border-gray-100 bg-gray-50 hidden">
                <div class="flex items-center gap-2">
                    <img id="user-img" src="" class="w-8 h-8 rounded-full">
                    <span id="user-name" class="text-sm font-medium text-gray-700"></span>
                </div>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
            <div id="welcome-message" class="bg-blue-50 border border-blue-100 p-8 rounded-2xl text-center">
                <h3 class="text-xl font-bold text-blue-900 mb-2">準備好開始了嗎？</h3>
                <p class="text-blue-700 mb-6">請點擊上方按鈕，使用您的 Google 帳戶安全登入。</p>
            </div>
        </main>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden"></div>

    <script>
        // 3. 插入: 處理 Google 登入回傳與解析
        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            console.log("登入成功:", data);
            
            // 更新畫面顯示
            document.getElementById('welcome-message').innerHTML = `
                <h3 class="text-xl font-bold text-blue-900 mb-2">歡迎回來，${data.name}！</h3>
                <p class="text-blue-700">您已成功透過 ${data.email} 登入系統。</p>
            `;
            
            // 顯示側邊欄使用者資訊
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-img').src = data.picture;
            document.getElementById('user-name').innerText = data.name;
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 側邊欄控制
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        });
    </script>
</body>
</html>
