<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台系統 - Google 登入版</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 插入 Google SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 10px; }
        .content-area { height: calc(100vh - 64px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 自定義 Google 按鈕樣式，確保在任何環境都能顯示 */
        .custom-google-btn {
            display: flex;
            align-items: center;
            padding: 0 12px;
            height: 40px;
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 20px;
            color: #3c4043;
            font-family: 'Google Sans', arial, sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .custom-google-btn:hover {
            background-color: #f8f9fa;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-hidden">

    <!-- 頂部置頂導覽列 -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <button id="menu-toggle" class="lg:hidden p-2 hover:bg-gray-100 rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
            
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">L</div>
                <h1 class="text-lg font-bold tracking-tight text-gray-800">控制台管理系統</h1>
            </div>
        </div>
        
        <!-- 右側狀態區 -->
        <div class="flex items-center gap-4">
            <!-- 登入前顯示：改用手寫 SVG 確保圖示顯示 -->
            <div id="login-section">
                <div id="g_id_onload"
                     data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com" 
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleCredentialResponse"
                     data-auto_prompt="false">
                </div>
                
                <!-- 手動建立的 Google 登入按鈕 -->
                <button class="custom-google-btn" onclick="triggerGoogleLogin()">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    使用 Google 帳戶登入
                </button>
            </div>

            <!-- 登入後顯示 -->
            <div id="user-header-profile" class="hidden flex items-center gap-3 pl-4 border-l border-gray-200 animate-fade-in">
                <div class="text-right hidden sm:block">
                    <p id="header-user-name" class="text-sm font-bold text-gray-900 leading-none"></p>
                    <p id="header-user-email" class="text-[10px] text-gray-500 mt-1"></p>
                </div>
                <img id="header-user-img" src="" class="w-9 h-9 rounded-full border-2 border-white shadow-sm object-cover">
                <button onclick="location.reload()" class="p-1.5 hover:bg-red-50 text-red-400 rounded-lg transition-colors" title="登出系統">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="flex content-area">
        <!-- 側邊欄 -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full lg:relative lg:translate-x-0 lg:flex w-64 flex-col bg-white border-r border-gray-200 transition-transform duration-300 ease-in-out z-40">
            <div class="p-4 flex-1 overflow-y-auto">
                <div class="space-y-1">
                    <p class="px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">主選單</p>
                    <button onclick="showTab('overview')" class="w-full flex items-center gap-3 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg font-medium nav-link" id="nav-overview">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                        </svg>
                        總覽
                    </button>
                    <button onclick="showTab('employer-detail')" class="w-full flex items-center gap-3 px-3 py-2 text-gray-600 hover:bg-gray-50 rounded-lg nav-link" id="nav-employer-detail">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                        詳細規格
                    </button>
                </div>
            </div>
            
            <div class="p-4 border-t border-gray-100 bg-gray-50/50">
                <div class="flex items-center gap-3">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-xs font-medium text-gray-600">系統即時監控中</span>
                </div>
            </div>
        </aside>

        <!-- 主要內容 -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
            <div id="tab-overview" class="tab-content active">
                <div id="welcome-message" class="bg-white border border-gray-200 p-10 rounded-2xl text-center mb-8 shadow-sm transition-all">
                    <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">👋</div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">歡迎使用管理系統</h3>
                    <p class="text-gray-500">請透過右上角的 Google 按鈕登入以存取您的個人資料。</p>
                </div>
                <!-- 指標卡片省略，結構同前... -->
            </div>

            <!-- 詳細規格分頁省略，結構同前... -->
            <div id="tab-employer-detail" class="tab-content">
                <!-- ... -->
            </div>
        </main>
    </div>

    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-30 lg:hidden"></div>

    <script>
        // 切換分頁邏輯
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            const targetTab = document.getElementById('tab-' + tabName);
            if (targetTab) targetTab.classList.add('active');
            
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-blue-50', 'text-blue-700', 'font-medium');
                link.classList.add('text-gray-600');
            });
            const activeLink = document.getElementById('nav-' + tabName);
            if (activeLink) {
                activeLink.classList.add('bg-blue-50', 'text-blue-700', 'font-medium');
                activeLink.classList.remove('text-gray-600');
            }
            if (window.innerWidth < 1024) toggleSidebar();
        }

        // 觸發 Google 登入視窗
        function triggerGoogleLogin() {
            google.accounts.id.prompt();
        }

        // 處理 Google 登入回傳
        function handleCredentialResponse(response) {
            const data = parseJwt(response.credential);
            
            document.getElementById('login-section').classList.add('hidden');
            const profileArea = document.getElementById('user-header-profile');
            profileArea.classList.remove('hidden');
            
            document.getElementById('header-user-img').src = data.picture;
            document.getElementById('header-user-name').innerText = data.name;
            document.getElementById('header-user-email').innerText = data.email;

            const welcomeMsg = document.getElementById('welcome-message');
            welcomeMsg.innerHTML = `
                <div class="flex flex-col items-center animate-fade-in">
                    <div class="relative mb-6">
                        <img src="${data.picture}" class="w-24 h-24 rounded-full border-4 border-white shadow-xl">
                        <div class="absolute bottom-1 right-1 w-6 h-6 bg-green-500 border-2 border-white rounded-full"></div>
                    </div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-1">歡迎回來，${data.name}</h3>
                    <p class="text-blue-600 font-medium text-sm mb-4">${data.email}</p>
                </div>
            `;
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 側邊欄控制
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
</body>
</html>
